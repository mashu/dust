# Build the WASM web app as GitHub Pages serves it, and check the site it
# makes: a stylesheet, the tab icon, the privacy page.
#
# CI runs this on every pull request and push, and the Pages workflow runs it
# again, with `upload`, to deploy what passed. Project sites are served at
# https://<owner>.github.io/<repo>/ ; base_path is injected here so local
# `dx serve --platform web` still runs at /.

name: Web site

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build; the caller's own when empty"
        type: string
        default: ""
      upload:
        description: "Upload the site as the Pages artifact, to deploy"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # The Rust every job builds with, the same in every workflow
  # (scripts/check-pinned-versions.sh): a new stable's lints wait for a
  # deliberate move.
  RUST_TOOLCHAIN: "1.99.1"
  DIOXUS_CLI_VERSION: "0.7.10"
  # Belt and braces with .cargo/config.toml: a Pages runner on a new LLVM
  # must not strip the wasm-bindgen metadata section.
  CARGO_PROFILE_RELEASE_STRIP: none

jobs:
  build:
    name: Build web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          # Every crate's build script runs here: leave it no token.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pages-web
          cache-directories: target/dx

      - name: Install cargo-binstall
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-binstall

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --locked \
            || cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          dx --version

      - name: Set GitHub Pages base path
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY##*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "User or org site; leaving base_path unset"
            exit 0
          fi
          sed -i "/^\[web.app\]/a base_path = \"${repo}\"" Dioxus.toml
          echo "Set web.app.base_path = ${repo}"
          cat Dioxus.toml

      - name: Bundle web
        run: dx bundle --release --locked --platform web --out-dir dist

      - name: Prepare Pages site
        run: |
          set -euo pipefail
          src=""
          for candidate in dist/public dist target/dx/dust/release/web/public; do
            if [[ -f "${candidate}/index.html" ]]; then
              src="$candidate"
              break
            fi
          done
          if [[ -z "$src" ]]; then
            echo "Web build output not found"
            find . -name index.html | head -50
            exit 1
          fi
          mkdir -p site
          cp -a "$src"/. site/
          cp site/index.html site/404.html
          mkdir -p site/privacy
          cp docs/privacy.html site/privacy/index.html
          touch site/.nojekyll
          if ! find site -name '*.css' | grep -q .; then
            echo "Bundled site has no stylesheet"
            find site -maxdepth 3 -type f
            exit 1
          fi
          # The tab icon is inline in index.html; without it a browser asks
          # for /favicon.ico at the domain's root, outside a project site.
          if ! grep -q 'rel="icon"' site/index.html; then
            echo "Bundled page links no icon"
            exit 1
          fi
          # wasm-bindgen's output: a release whose strip removed the section
          # it reads leaves a site with no app in it.
          if ! find site -name '*.wasm' | grep -q .; then
            echo "Bundled site has no wasm"
            find site -maxdepth 3 -type f
            exit 1
          fi
          test -f site/privacy/index.html
          ls -lh site site/assets

      - name: Upload Pages artifact
        if: inputs.upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
