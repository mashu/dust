# Deploy the WASM web app to GitHub Pages once CI has passed on main.
#
# One-time: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The site is built by web-site.yml, the same build CI checks on every pull
# request. Only a push to main whose whole CI run passed is deployed, from
# the commit that run tested; Run workflow deploys the chosen branch as it
# stands.

name: GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build web
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    uses: ./.github/workflows/web-site.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      upload: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
