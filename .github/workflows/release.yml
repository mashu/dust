# Build installers on a version tag (v*) and publish a GitHub Release.
#
# Triggers:
# - git push of v*.*.* tags (`push`)
# - Actions → Release → Run workflow (optional tag input)
#
# A tag push also emits `create`. Listening for both starts two runs of this
# workflow, they share one concurrency group, and GitHub cancels one. The
# cancelled run shows as a failed release, so only the push is listened for.
# A tag made in the GitHub UI can be built with Run workflow.
#
# Only a commit whose CI passed on a push to main is released: the bundles
# below run no tests of their own. A tag pushed while that CI run is still
# going waits for it.
#
# GitHub-hosted runners produce Linux, Windows, and macOS desktop bundles
# (each on its native OS). The web app is deployed separately to GitHub Pages.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0). Required when running from a branch."
        required: false
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Rust every job builds with, the same in every workflow
  # (scripts/check-pinned-versions.sh): a new stable's lints wait for a
  # deliberate move.
  RUST_TOOLCHAIN: "1.99.1"
  DIOXUS_CLI_VERSION: "0.7.10"

jobs:
  version:
    name: Check version
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      # To read the CI runs of the commit.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "Run this workflow from a version tag, or pass the tag input."
            exit 1
          fi
          # Whole: it goes on into GITHUB_OUTPUT, and a line break there would
          # write an output of its own.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' is not vX.Y.Z"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using tag $tag"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Resolve and verify version
        id: version
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '
            /^\[workspace.package\]/ { in_pkg = 1; next }
            in_pkg && /^\[/ { in_pkg = 0 }
            in_pkg && /^version *=/ {
              gsub(/[" ]/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$cargo_version" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml"
            exit 1
          fi
          tag="${TAG#v}"
          if [[ "$tag" != "$cargo_version" ]]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${cargo_version}"

      - name: Check that CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # A commit pushed together with its tag may not have its CI run
          # listed yet when this first looks.
          unseen=0
          while :; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${sha}" \
              --jq '[.workflow_runs[] | .conclusion // "running"] | join(" ")')"
            case " ${runs} " in
              *" success "*)
                echo "CI passed on ${sha}"
                break
                ;;
              "  ")
                unseen=$((unseen + 1))
                if ((unseen > 5)); then
                  echo "No CI run for a push of ${sha}: tag a commit on main, once its CI has passed."
                  exit 1
                fi
                echo "No CI run for ${sha} yet; looking again"
                sleep 30
                ;;
              *" running "*)
                echo "CI on ${sha} is still running; waiting for it"
                sleep 60
                ;;
              *)
                echo "CI on ${sha} did not pass (${runs}): release a commit whose CI did."
                exit 1
                ;;
            esac
          done

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            platform: linux
            package_types: deb
          - name: Windows
            os: windows-latest
            platform: windows
            package_types: nsis
          - name: macOS
            os: macos-latest
            platform: macos
            package_types: dmg
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - name: Fix rust-objcopy LLVM dylib path
        if: runner.os == 'macOS'
        run: bash scripts/fix-macos-rust-objcopy.sh

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.platform }}
          cache-directories: target/dx

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            dpkg-dev

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install cargo-binstall
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-binstall

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --locked \
            || cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          dx --version

      - name: Bundle
        env:
          PLATFORM: ${{ matrix.platform }}
          PACKAGE_TYPES: ${{ matrix.package_types }}
        run: |
          dx bundle --release --locked \
            --platform "$PLATFORM" \
            --package-types "$PACKAGE_TYPES" \
            --out-dir dist

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          arch_raw="$(uname -m)"
          case "$arch_raw" in
            arm64|aarch64) arch=aarch64 ;;
            x86_64|amd64) arch=x86_64 ;;
            *) arch="$arch_raw" ;;
          esac

          search_roots=""
          if [[ -d dist ]]; then
            search_roots="$search_roots dist"
          fi
          if [[ -d target/dx ]]; then
            search_roots="$search_roots target/dx"
          fi
          if [[ -z "$search_roots" ]]; then
            echo "No bundle output directories were produced"
            ls -la
            exit 1
          fi

          echo "Bundle outputs:"
          find $search_roots -type f | sort | head -200

          # `dx` writes each installer into both dist/ and target/dx, so the same
          # file turns up twice and the second copy used to be attached to the
          # release under its raw name. Keep the first path per basename.
          list="${RUNNER_TEMP}/dust-artifacts.txt"
          find $search_roots -type f \( \
            -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
          \) | sort | awk -F/ '!seen[$NF]++' > "$list"

          copied=0
          while IFS= read -r src; do
            [[ -z "$src" ]] && continue
            base="$(basename "$src")"
            # Skip inner payload copies; keep packaged installers.
            if [[ "$base" == "dust.exe" || "$base" == "dust" ]]; then
              continue
            fi
            ext="${base##*.}"
            case "$PLATFORM" in
              linux) dest="dust-${VERSION}-${arch}-unknown-linux-gnu.${ext}" ;;
              windows) dest="dust-${VERSION}-${arch}-pc-windows-msvc-setup.${ext}" ;;
              macos) dest="dust-${VERSION}-${arch}-apple-darwin.${ext}" ;;
              *) dest="dust-${VERSION}-${PLATFORM}.${ext}" ;;
            esac
            if [[ -e "artifacts/${dest}" ]]; then
              dest="dust-${VERSION}-${base}"
            fi
            cp "$src" "artifacts/${dest}"
            copied=$((copied + 1))
          done < "$list"

          if [[ "$copied" -eq 0 ]]; then
            echo "No installer packages found; collecting the raw binary"
            bin=""
            while IFS= read -r src; do
              [[ -z "$src" ]] && continue
              base="$(basename "$src")"
              if [[ "$base" == "dust" || "$base" == "dust.exe" ]]; then
                bin="$src"
              fi
            done < <(find $search_roots -type f \( -name dust -o -name dust.exe \) | sort)
            if [[ -z "$bin" ]]; then
              echo "No installer artifacts or binaries were produced"
              exit 1
            fi
            case "$PLATFORM" in
              windows)
                dest="dust-${VERSION}-${arch}-pc-windows-msvc.exe"
                cp "$bin" "artifacts/${dest}"
                ;;
              linux)
                dest="dust-${VERSION}-${arch}-unknown-linux-gnu.tar.gz"
                tar -czf "artifacts/${dest}" -C "$(dirname "$bin")" "$(basename "$bin")"
                ;;
              macos)
                dest="dust-${VERSION}-${arch}-apple-darwin.tar.gz"
                tar -czf "artifacts/${dest}" -C "$(dirname "$bin")" "$(basename "$bin")"
                ;;
            esac
            copied=1
          fi

          ls -lh artifacts

      - name: Check the .deb declares the libraries it needs
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for deb in artifacts/*.deb; do
            scripts/check-deb-depends.sh "$deb"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dust-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # New pipeline: an Android failure must never hold back the desktop release.
    continue-on-error: true
    env:
      ANDROID_TRIPLE: aarch64-linux-android
      NDK_FALLBACK_VERSION: "27.2.12479018"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # Each release's APK must install over the last one, so it is signed with
      # the release key, never a debug key Gradle makes on the runner. Without
      # the key this job fails, and the release goes out with no APK.
      - name: Set up the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/android-release-signing.sh
          if ! install_android_release_signing "$PWD" "${RUNNER_TEMP}/dust-release.p12"; then
            echo "::error title=No Android release key::The release has no APK. Add the ANDROID_* secrets (docs/platforms.md, Release signing)."
            # The job may fail and the release still go out: the run's page
            # says what it lacks, beside a green tick.
            echo "**No Android APK in this release**: the ANDROID_* signing secrets are not set (docs/platforms.md, Release signing)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ANDROID_RELEASE_CERT_SHA256=${ANDROID_RELEASE_CERT_SHA256}" >> "$GITHUB_ENV"

      - name: Resolve the Android SDK and NDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk" || ! -d "$sdk" ]]; then
            echo "No Android SDK on this runner."
            exit 1
          fi

          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="$(find "$sdk/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_FALLBACK_VERSION}"
            ndk="$sdk/ndk/${NDK_FALLBACK_VERSION}"
          fi

          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"

      # Not target/dx: the Gradle project dx writes there holds the key's
      # passwords.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-android

      - name: Install cargo-binstall
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-binstall

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --locked \
            || cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          dx --version

      - name: Bundle APK
        run: |
          set -euo pipefail
          # dx writes the stock robot as the launcher icon and 1 as the
          # version code; the hook puts both right.
          # shellcheck disable=SC1091
          source scripts/android-gradle-hook.sh
          install_android_gradle_hook "$PWD"
          trap 'rm -f "$ANDROID_GRADLE_HOOK"' EXIT
          dx bundle --release --locked \
            --platform android \
            --target "${ANDROID_TRIPLE}" \
            --package-types apk

      - name: Collect APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Bundle outputs:"
          find target/dx -name '*.apk' -type f | sort

          apk="$(find target/dx -name '*.apk' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [[ -z "$apk" ]]; then
            echo "No APK was produced"
            exit 1
          fi
          # shellcheck disable=SC1091
          source scripts/android-gradle-hook.sh
          check_android_apk_version "$PWD" "$apk"
          check_android_page_size "$apk"
          # shellcheck disable=SC1091
          source scripts/android-release-signing.sh
          check_android_apk_release "$apk" "$ANDROID_RELEASE_CERT_SHA256"
          mkdir -p artifacts
          cp "$apk" "artifacts/dust-${VERSION}-android-arm64.apk"
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dust-android
          path: artifacts/*
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: |
          rm -rf target/dx "${RUNNER_TEMP}/dust-release.p12"
          git checkout -- Dioxus.toml

  ios:
    name: iOS IPA
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    # Unsigned and sideload-only; never let it hold back the other bundles.
    continue-on-error: true
    env:
      IOS_TRIPLE: aarch64-apple-ios
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios
          components: llvm-tools-preview

      - name: Fix rust-objcopy LLVM dylib path
        run: bash scripts/fix-macos-rust-objcopy.sh

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-ios
          cache-directories: target/dx

      - name: Install cargo-binstall
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-binstall

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --locked \
            || cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          dx --version

      # `dx` codesigns only when asked, so this is an unsigned .app. Its own .ipa
      # packaging verifies a signature, hence `--package-types ios` plus the
      # Payload zip below.
      - name: Bundle the app
        run: |
          dx bundle --release --locked \
            --platform ios \
            --target "${IOS_TRIPLE}" \
            --package-types ios

      - name: Package an unsigned IPA
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Bundle outputs:"
          find target/dx -maxdepth 6 -name '*.app' -type d | sort

          app="$(find target/dx -name '*.app' -type d | head -1)"
          if [[ -z "$app" ]]; then
            echo "No .app bundle was produced"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload artifacts
          cp -R "$app" Payload/
          zip -qry "artifacts/dust-${VERSION}-ios-unsigned.ipa" Payload
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dust-ios
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, build, android, ios]
    # Publish as long as the desktop bundles are good; Android is best-effort.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Dust v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
