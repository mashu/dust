name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Rust every job builds with, the same in every workflow
  # (scripts/check-pinned-versions.sh): a new stable's lints wait for a
  # deliberate move.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check the Rust and dx pins agree
        run: scripts/check-pinned-versions.sh

      # Android's event loop is tao 0.34.8 with tao 0.37.0's fix for a lost
      # wake, patched in from vendor/tao. A copy without the fix, or one a
      # dioxus upgrade has left unused, fails here rather than on a phone.
      - name: Check tao is patched with its Android fix
        run: scripts/check-tao-patch.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview, clippy, rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      # The runner has no sound card. ALSA's null device gives cpal a real
      # output to open, so the native audio backend is exercised here rather
      # than skipped.
      - name: Give ALSA a null output device
        run: |
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"

      - name: Lint
        run: cargo clippy --workspace --features desktop --all-targets --locked -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov

      # The app's tests run the page's key scripts in Node, on a page made up
      # for them (src/fake_page.mjs). Elsewhere they skip without it; here,
      # where CI is set, a missing Node fails them.
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test cw-core
        run: cargo llvm-cov -p cw-core --locked --lcov --output-path lcov-cw-core.info

      - name: Test desktop app
        run: cargo llvm-cov -p dust --features desktop --locked --lcov --output-path lcov-dust.info

      # The web and mobile-silent backends are not part of the coverage run, so
      # lint them here: they share the session runtime with the desktop build
      # and must keep up with it, and code only they compile would otherwise
      # never see the workspace lints.
      - name: Lint the web build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p dust --no-default-features --features web --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Lint the silent build
        run: cargo clippy -p dust --no-default-features --features mobile-silent --all-targets --locked -- -D warnings

      # The silent backend is the only one with no device behind it, so its
      # timing is all a session has to go on: run the app's tests through it.
      - name: Test the silent build
        run: cargo test -p dust --no-default-features --features mobile-silent --locked

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov-cw-core.info,lcov-dust.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  android-check:
    name: Android type-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android
          components: clippy

      - name: Resolve the Android NDK toolchain
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="$(find "$sdk/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            echo "No Android NDK on this runner."
            exit 1
          fi

          # cpal pulls oboe, whose C++ is built by cc-rs. cc-rs looks for an
          # unversioned `aarch64-linux-android-clang++`, which the NDK does not
          # ship, so point it at the API-versioned wrapper the way `dx` does.
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$bin/aarch64-linux-android24-clang"
          if [[ ! -x "$cc" ]]; then
            cc="$(find "$bin" -maxdepth 1 -name 'aarch64-linux-android*-clang' | sort -V | head -1 || true)"
          fi
          if [[ ! -x "$cc" ]]; then
            echo "No aarch64 clang wrapper in $bin"
            ls "$bin" | head -30
            exit 1
          fi

          echo "NDK: $ndk"
          echo "CC:  $cc"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$cc"
            echo "CXX_aarch64_linux_android=${cc}++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
          } >> "$GITHUB_ENV"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-check

      # Clippy never links, so this catches mobile regressions without
      # building an APK — including the cpal/oboe C++ that Android audio
      # needs — and holds the Android-only code (JNI, the files folder, the
      # screen flag) to the workspace lints, which no other job compiles.
      - name: Lint the mobile build
        run: cargo clippy -p dust --no-default-features --features mobile --target aarch64-linux-android --locked -- -D warnings

  ios-check:
    name: iOS type-check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios-sim
          components: clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ios-check

      # The simulator target needs no signing and no Apple account, so this
      # catches iOS regressions — including the AVAudioSession code and cpal's
      # CoreAudio backend — on every PR, under the workspace lints. The IPA
      # itself is built on demand by the iOS IPA workflow.
      - name: Lint the iOS build
        run: cargo clippy -p dust --no-default-features --features mobile --target aarch64-apple-ios-sim --locked -- -D warnings

  # The desktop app is tested on Linux only. Windows and macOS each compile
  # code of their own — WebView2 or WKWebView, WASAPI or CoreAudio, the
  # floating window's click-through, where files go — so each is linted on
  # its own runner, tests included, before a release has to find out.
  desktop-check:
    name: Desktop lint (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop-check-${{ matrix.os }}

      - name: Lint the desktop build
        run: cargo clippy --workspace --features desktop --all-targets --locked -- -D warnings

  # The web app built as Pages serves it, and the site it makes checked, on
  # every pull request: what only `dx bundle` does — wasm-bindgen, the
  # stylesheet asset, the page's head — fails here rather than on main.
  web:
    name: Web site
    uses: ./.github/workflows/web-site.yml
