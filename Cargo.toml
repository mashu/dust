[workspace]
members = [".", "crates/cw-core"]
default-members = ["crates/cw-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[package]
name = "dust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dust — CW Morse group trainer (desktop and WebAssembly)"

[dependencies]
cw-core = { path = "crates/cw-core" }
dioxus = "0.7.10"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

# Web / WASM
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlInputElement",
    "Element",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "OscillatorNode",
    "OscillatorType",
    "GainNode",
    "AudioParam",
    "AudioNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioScheduledSourceNode",
    "BiquadFilterNode",
    "BiquadFilterType",
    "Storage",
] }

# Linux / desktop
cpal = { version = "0.15", optional = true }
dirs = { version = "6", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["time", "rt"] }

[features]
default = []
web = [
    "dioxus/web",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
desktop = ["dioxus/desktop", "dep:cpal", "dep:dirs", "dep:tokio"]

[profile.release]
lto = true
codegen-units = 1
strip = true
