    <script>
      // Paint the saved theme before the first frame so there is no light flash.
      try {
        var saved = localStorage.getItem("dust_theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
    <style>
      html, body, #main {
        margin: 0;
        min-height: 100%;
        background: #f2e9d9;
        color: #1b2436;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(1100px 460px at 50% -160px, rgba(196, 92, 38, 0.16) 0%, transparent 72%),
          linear-gradient(180deg, #f7f0e2 0%, #f2e9d9 42%, #dccfb6 100%);
      }
      #main:not(:empty) ~ #boot { display: none; }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        border-radius: 16px;
        background: linear-gradient(150deg, #27344f, #1b2436);
        color: #e07b3e;
        font-family: ui-monospace, monospace;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        box-shadow: 0 18px 40px rgba(27, 36, 54, 0.22);
      }
      .boot-name {
        font-family: Georgia, serif;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        opacity: 0.62;
      }
      .boot-pulse {
        width: 8rem;
        height: 3px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(27, 36, 54, 0.12);
      }
      .boot-pulse > span {
        display: block;
        width: 40%;
        height: 100%;
        background: #c45c26;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) body,
        html:not([data-theme="light"]) #main,
        html:not([data-theme="light"]) { background: #0d1017; color: #edf1f8; }
        html:not([data-theme="light"]) #boot {
          background:
            radial-gradient(1100px 460px at 50% -160px, rgba(255, 139, 76, 0.18) 0%, transparent 72%),
            linear-gradient(180deg, #11151e 0%, #0d1017 42%, #05070c 100%);
        }
        html:not([data-theme="light"]) .boot-pulse { background: rgba(255, 255, 255, 0.1); }
        html:not([data-theme="light"]) .boot-pulse > span { background: #f5843f; }
      }
      html[data-theme="dark"] body,
      html[data-theme="dark"] #main,
      html[data-theme="dark"] { background: #0d1017; color: #edf1f8; }
      html[data-theme="dark"] #boot {
        background:
          radial-gradient(1100px 460px at 50% -160px, rgba(255, 139, 76, 0.18) 0%, transparent 72%),
          linear-gradient(180deg, #11151e 0%, #0d1017 42%, #05070c 100%);
      }
      html[data-theme="dark"] .boot-pulse { background: rgba(255, 255, 255, 0.1); }
      html[data-theme="dark"] .boot-pulse > span { background: #f5843f; }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <div id="boot">
      <div class="boot-mark" aria-hidden="true">·−</div>
      <div class="boot-name">Dust</div>
      <div class="boot-pulse" aria-hidden="true"><span></span></div>
    </div>
  </body>
</html>
