<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2740" />
    <title>Dust</title>
    <style>
      html, body, #main {
        margin: 0;
        min-height: 100%;
        background: #e7dcc8;
        color: #1c2740;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 40;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(1200px 480px at 50% -80px, #2a3b5c 0%, transparent 70%),
          linear-gradient(180deg, #e7dcc8 0%, #f3ead9 28%, #efe4d0 100%);
      }
      #main:not(:empty) ~ #boot { display: none; }
      .boot-bar {
        background: linear-gradient(180deg, #1c2740, #243352);
        color: #f8f1e3;
        padding: 0.55rem 1.1rem;
        font-weight: 600;
        font-size: 0.98rem;
        letter-spacing: -0.02em;
      }
      .boot-pulse {
        width: 7.5rem;
        height: 3px;
        margin: 2.75rem auto 0;
        overflow: hidden;
        border-radius: 99px;
        background: #e4d5c0;
      }
      .boot-pulse > span {
        display: block;
        width: 40%;
        height: 100%;
        background: #c45c26;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <div id="boot">
      <div class="boot-bar">Dust</div>
      <div class="boot-pulse" aria-hidden="true"><span></span></div>
    </div>
  </body>
</html>
