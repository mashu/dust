[application]
name = "dust"

[web.app]
# `dx bundle` writes this into index.html's <title> in place of
# {app_title}. With no placeholder there it adds the title to whatever the
# <title> holds, so a "Dust" of index.html's own read "DustDust". The
# desktop window and the app at run time name themselves (src/main.rs,
# src/app.rs).
title = "Dust"

[web.watcher]
watch_path = ["src", "assets", "crates"]

[web.resource]
# Do not list styles.css here. `dx bundle` injects the <link> but does not
# copy the file. The app declares the sheet as a static-head `asset!`
# instead (src/app.rs), which `dx bundle` both copies and links from the
# <head> of index.html.
style = []
script = []

[web.resource.dev]
script = []
style = []

[bundle]
identifier = "dev.dust.morse"
publisher = "Dust"
category = "Education"
short_description = "CW Morse group trainer"
# Freedesktop sizes of assets/icon.png. GNOME reads these from hicolor;
# regenerate them with scripts/render-linux-icons.py.
icon = [
    "assets/linux/16x16.png",
    "assets/linux/22x22.png",
    "assets/linux/24x24.png",
    "assets/linux/32x32.png",
    "assets/linux/36x36.png",
    "assets/linux/48x48.png",
    "assets/linux/64x64.png",
    "assets/linux/72x72.png",
    "assets/linux/96x96.png",
    "assets/linux/128x128.png",
    "assets/linux/192x192.png",
    "assets/linux/256x256.png",
    "assets/linux/512x512.png",
]

[bundle.deb]
desktop_template = "assets/linux/dust.desktop.hbs"
# The packages of the shared libraries the binary links, as dpkg-shlibdeps
# names them on the release's Ubuntu 24.04. dx looks at no binary, so
# without these apt installs the .deb onto a desktop without WebKitGTK and
# Dust fails to start. Debian 13 and Ubuntu 24.04 renamed four of them with
# a t64; the older name stands in for older releases. The release checks
# this list against the binary (scripts/check-deb-depends.sh).
depends = [
    "libasound2t64 | libasound2",
    "libc6",
    "libcairo2",
    "libgcc-s1",
    "libgdk-pixbuf-2.0-0",
    "libglib2.0-0t64 | libglib2.0-0",
    "libgtk-3-0t64 | libgtk-3-0",
    "libjavascriptcoregtk-4.1-0",
    "libsoup-3.0-0",
    "libssl3t64 | libssl3",
    "libwebkit2gtk-4.1-0",
    "libxdo3",
]

# Play Store submissions from 2026-08-31 must target API 36.
# Signing stays out of this file: CI adds the release key at build time
# (scripts/android-release-signing.sh), and scripts/android-play-bundle.sh
# signs with the Play upload key.
[android]
min_sdk = 24
target_sdk = 36
compile_sdk = 36

# Backups are saved in the app's Documents folder (src/persist/desktop.rs).
# These keys show that folder in the Files app, under On My iPhone, where a
# backup can be moved, shared, or chosen again to restore from.
[ios.raw]
info_plist = """
<key>UIFileSharingEnabled</key>
<true/>
<key>LSSupportsOpeningDocumentsInPlace</key>
<true/>
"""
