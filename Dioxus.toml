[application]
name = "dust"

[web.app]
title = "Dust"

[web.watcher]
watch_path = ["src", "assets", "crates"]

[web.resource]
# The only copy of the sheet on web. Desktop inlines it in the window head;
# AppHead does not inject it again.
style = ["assets/styles.css"]
script = []

[web.resource.dev]
script = []
style = []

[bundle]
identifier = "dev.dust.morse"
publisher = "Dust"
short_description = "CW Morse group trainer"

# Play Store submissions from 2026-08-31 must target API 36.
# Signing stays out of this file: see scripts/android-play-bundle.sh.
[android]
min_sdk = 24
target_sdk = 36
compile_sdk = 36
